# Met le jeu en ligne sur GitHub Pages à chaque envoi sur la branche main.
# Adresse : https://<ton-compte>.github.io/<nom-du-dépôt>/
# À activer une fois : dépôt → Settings → Pages → Source : « GitHub Actions ».
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers du jeu
        run: |
          mkdir site
          cp -r index.html manifest.webmanifest sw.js css js fonts icons assets site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
